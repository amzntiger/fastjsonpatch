[package]
name = "fastjsonpatch"
version = "0.1.4"
edition = "2024"
description = "Rust core of the fastjsonpatch Python package"
license = "BSD-3-Clause"
publish = false

[dependencies]
ahash = "0.8.12"
pyo3 = { version = "0.29.3", features = ["extension-module", "abi3-py310"] }

[lib]
name = "_core"
crate-type = ["cdylib"]

[profile.release]
lto = "fat"
codegen-units = 1
